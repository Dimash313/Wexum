# PROPOSAL ONLY: this path is not recognized by GitHub Actions.
# Integrator must review and copy to .github/workflows/android.yml in a separate authorized PR.
name: vpn-android-checks
on:
  pull_request:
    paths:
      - 'apps/vpn/android/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/vpn/android/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
concurrency:
  group: vpn-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'
      - name: Unit, lint, and debug APK compilation
        run: bash apps/vpn/android/ci/android-check.sh
